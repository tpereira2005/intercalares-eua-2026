# Raiz do espaço de trabalho Python (uv). Não é um pacote: agrupa os membros
# e as ferramentas de qualidade partilhadas.
[tool.uv.workspace]
members = ["schemas", "pipeline"]

[tool.uv.sources]
contratos = { workspace = true }
pipeline = { workspace = true }

[dependency-groups]
dev = [
    "contratos",
    "pipeline",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["schemas/src", "pipeline/src"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM",
    "RET", "PTH", "PL", "RUF", "S", "PT", "TID", "ERA",
]
ignore = [
    "PLR0913", # muitos argumentos: os conectores recebem configuração explícita
    "PLR2004", # números mágicos: comuns em limiares estatísticos documentados
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = ["schemas/src", "pipeline/src"]
explicit_package_bases = true
files = ["schemas/src", "schemas/tests", "pipeline/src", "pipeline/tests"]

[tool.pytest.ini_options]
testpaths = ["schemas/tests", "pipeline/tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
