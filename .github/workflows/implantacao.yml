name: Implantação

# Publica o site e o Worker na Cloudflare (plano gratuito) depois de cada CI verde no main
# e de cada atualização dos dados (voto antecipado e previsão). Enquanto a variável
# CLOUDFLARE_ACCOUNT_ID não existir no repositório, o job é saltado sem erro
# (ver docs/implantacao.md).
on:
  workflow_run:
    workflows: [CI, Voto antecipado, Previsão]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Uma implantação de cada vez; a mais recente substitui a que ainda espera.
concurrency:
  group: implantacao
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  cloudflare:
    name: Publicar na Cloudflare
    if: >-
      vars.CLOUDFLARE_ACCOUNT_ID != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Publica sempre o estado atual do main, mesmo quando o gatilho foi a recolha de dados.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Descarregar os dados publicados
        run: pnpm --filter @intercalares/web dados:obter
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # O build valida cada ficheiro contra o contrato: dados inválidos nunca são publicados.
      - run: pnpm build
      - name: Garantir a base de dados D1
        run: node apps/edge/scripts/preparar-d1.mjs
      - name: Aplicar migrações
        run: pnpm --filter @intercalares/edge exec wrangler d1 migrations apply intercalares-eua-2026 --remote
      - name: Publicar o Worker e o site
        run: pnpm --filter @intercalares/edge exec wrangler deploy
