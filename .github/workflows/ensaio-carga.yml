name: Ensaio de carga

# Ensaio da noite eleitoral na Cloudflare (docs/teste-carga-noite.md, secção "Ensaio na
# Cloudflare"). Implanta um segundo Worker, intercalares-eua-2026-ensaio, sem cron nem D1,
# a ler uma Release de ensaio; corre a carga sobre ele; e apaga-o no fim. Nunca toca no
# Worker de produção. Só manual.
on:
  workflow_dispatch:
    inputs:
      acao:
        description: "implantar, carga ou remover"
        type: choice
        options: [implantar, carga, remover]
        default: implantar
      etiqueta:
        description: "Release com parciais.json, saude.json e chamadas-2026.json do ensaio"
        default: resultados-ensaio
      etiqueta_noite:
        description: "Release com a projeção e o histórico da noite"
        default: resultados-ensaio
      ano_noite:
        description: "Ano nos nomes da projeção e do histórico (projecao-noite-<ano>.json)"
        default: "2024"
      url:
        description: "Endereço do Worker de ensaio (só para a carga)"
        default: https://intercalares-eua-2026-ensaio.tomasmoraispereira-f5e.workers.dev
      leitores:
        description: "Leitores simulados (um pedido por minuto cada)"
        default: "200"
      duracao:
        description: "Minutos de carga (o total não passa de 30 000 pedidos)"
        default: "30"

permissions:
  contents: read

concurrency:
  group: ensaio-carga
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  implantar:
    name: Implantar o Worker de ensaio
    if: inputs.acao == 'implantar' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ETIQUETA: ${{ inputs.etiqueta }}
      ETIQUETA_NOITE: ${{ inputs.etiqueta_noite }}
      ANO_NOITE: ${{ inputs.ano_noite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Descarregar os dados publicados
        run: pnpm --filter @intercalares/web dados:obter
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm build
      - name: Configurar o Worker de ensaio
        working-directory: apps/edge
        run: node scripts/configurar-ensaio.mjs --etiqueta "$ETIQUETA" --etiqueta-noite "$ETIQUETA_NOITE" --ano-noite "$ANO_NOITE"
      - name: Publicar o Worker de ensaio
        run: pnpm --filter @intercalares/edge exec wrangler deploy --config wrangler.ensaio.json

  carga:
    name: Carga sobre o Worker de ensaio
    if: inputs.acao == 'carga'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      URL_ENSAIO: ${{ inputs.url }}
      LEITORES: ${{ inputs.leitores }}
      DURACAO: ${{ inputs.duracao }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Correr a carga
        working-directory: apps/edge
        run: |
          node scripts/carga-remota.mjs --url "$URL_ENSAIO" --leitores "$LEITORES" \
            --duracao "$DURACAO" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

  remover:
    name: Apagar o Worker de ensaio
    if: inputs.acao == 'remover' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apagar
        run: pnpm --filter @intercalares/edge exec wrangler delete --name intercalares-eua-2026-ensaio --force
