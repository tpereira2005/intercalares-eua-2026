name: Vigia da noite

# Avisa quando uma fonte de resultados ou a própria recolha param (ver
# pipeline/src/pipeline/jobs/vigia.py e docs/noite-eleitoral-operacao.md). Lê o saude.json
# que o workflow Resultados envia para a Release "resultados-2026" a cada 5 minutos e, se
# houver alertas, abre (ou atualiza) um issue "Vigia da noite eleitoral", que chega por
# notificação do GitHub. O cron só corre nas datas da noite (UTC): de 3 de novembro às
# 22h até 5 de novembro às 12h59.
on:
  schedule:
    - cron: "*/10 22-23 3 11 *"
    - cron: "*/10 * 4 11 *"
    - cron: "*/10 0-12 5 11 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vigia-noite
  cancel-in-progress: true

env:
  UV_LOCKED: "1"
  TITULO: Vigia da noite eleitoral

jobs:
  vigia:
    name: Vigia
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Ler o saude.json
        id: vigia
        run: |
          set +e
          uv run python -m pipeline.jobs.vigia \
            --saude "https://github.com/${{ github.repository }}/releases/download/resultados-2026/saude.json" \
            --resumo resumo.md
          echo "codigo=$?" >> "$GITHUB_OUTPUT"
      - name: Abrir ou atualizar o issue
        if: ${{ steps.vigia.outputs.codigo != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          numero=$(gh issue list --state open --search "\"$TITULO\" in:title" --json number -q '.[0].number')
          if [ -n "$numero" ]; then
            gh issue comment "$numero" --body-file resumo.md
          else
            gh issue create --title "$TITULO" --body-file resumo.md
          fi
