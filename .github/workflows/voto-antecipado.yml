name: Voto antecipado

# Recolhe os ficheiros oficiais de voto antecipado e produz o ficheiro publicado.
# O cron do GitHub atrasa-se com frequência; quando o Worker da Cloudflare estiver ativo,
# passa a ser ele a disparar este workflow (workflow_dispatch) na hora certa.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voto-antecipado
  cancel-in-progress: false

env:
  UV_LOCKED: "1"

jobs:
  carolina-do-norte:
    name: Carolina do Norte
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --all-packages
      # Só ficheiros públicos tal como vêm da fonte (registos públicos da NCSBE), para que os
      # pedidos condicionais respondam 304 quando nada mudou. Nunca tabelas derivadas.
      - name: Restaurar ficheiros da fonte
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/brutos/nc
          key: nc-brutos-${{ github.run_id }}
          restore-keys: nc-brutos-
      - name: Recolher e calcular
        run: >-
          uv run python -m pipeline.jobs.voto_antecipado_nc
          --saida data/publicado/voto-antecipado/nc.json
          --cubos data/publicado/voto-antecipado/cubos
      - name: Guardar o resultado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voto-antecipado-nc
          path: data/publicado/voto-antecipado
          retention-days: 30

  # Publica o JSON num asset de uma Release fixa, substituído a cada execução: o build do
  # site descarrega-o daí. Assim não há commits a cada duas horas e continua a custo zero.
  # Job separado para que só ele tenha permissão de escrita, sem código de terceiros.
  publicar:
    name: Publicar nc.json
    needs: carolina-do-norte
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ETIQUETA: dados-voto-antecipado
    steps:
      - name: Descarregar o resultado
        run: gh run download "$GITHUB_RUN_ID" --name voto-antecipado-nc --dir resultado
      - name: Validar
        run: jq -e '.estado == "NC" and (.ciclos | length) > 0' resultado/nc.json
      - name: Substituir o asset da Release
        run: |
          if ! gh release view "$ETIQUETA" > /dev/null 2>&1; then
            gh release create "$ETIQUETA" --title "Dados do voto antecipado" --latest=false \
              --notes "Ficheiros publicados pelo workflow Voto antecipado. Substituídos a cada execução; só contagens agregadas."
          fi
          gh release upload "$ETIQUETA" resultado/nc.json --clobber
