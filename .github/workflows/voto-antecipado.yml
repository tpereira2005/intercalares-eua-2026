name: Voto antecipado

# Recolhe os ficheiros oficiais de voto antecipado e produz o ficheiro publicado.
# O cron do GitHub atrasa-se com frequência; quando o Worker da Cloudflare estiver ativo,
# passa a ser ele a disparar este workflow (workflow_dispatch) na hora certa.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voto-antecipado
  cancel-in-progress: false

env:
  UV_LOCKED: "1"

jobs:
  carolina-do-norte:
    name: Carolina do Norte
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --all-packages
      # Só ficheiros públicos tal como vêm da fonte (registos públicos da NCSBE), para que os
      # pedidos condicionais respondam 304 quando nada mudou. Nunca tabelas derivadas.
      - name: Restaurar ficheiros da fonte
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/brutos/nc
          key: nc-brutos-${{ github.run_id }}
          restore-keys: nc-brutos-
      - name: Recolher e calcular
        run: >-
          uv run python -m pipeline.jobs.voto_antecipado_nc
          --saida data/publicado/voto-antecipado/nc.json
          --cubos data/publicado/voto-antecipado/cubos
      # Diagnóstico etário do modelo (peso zero). Antes de 14 dias da eleição ou com menos de
      # 200 000 votos antecipados não escreve nada e termina com sucesso; a publicação só
      # envia os ficheiros que existem. O dia dos dados é o dados_ate do nc.json.
      # Uma falha aqui não impede a publicação do nc.json.
      - name: Sinal etário
        continue-on-error: true
        run: >-
          uv run python -m pipeline.jobs.idade_nc
          --cubo data/publicado/voto-antecipado/cubos/cubo_demografico_2026.parquet
          --saida data/publicado/voto-antecipado/idade-nc.json
          --nc data/publicado/voto-antecipado/nc.json
      - name: Guardar o resultado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voto-antecipado-nc
          path: data/publicado/voto-antecipado
          retention-days: 30

  # Estados com boletins mas sem ficheiro de eleitores gratuito (ver
  # pipeline/src/pipeline/connectors/early_vote/agregados.py).
  estados:
    name: Estado ${{ matrix.estado }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        estado: [PA, ME]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Pasta do estado
        id: pasta
        run: echo "nome=$(echo '${{ matrix.estado }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      # Só ficheiros públicos tal como vêm da fonte, para os pedidos condicionais.
      - name: Restaurar ficheiros da fonte
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/brutos/${{ steps.pasta.outputs.nome }}
          key: ${{ steps.pasta.outputs.nome }}-brutos-${{ github.run_id }}
          restore-keys: ${{ steps.pasta.outputs.nome }}-brutos-
      - name: Recolher e calcular
        run: >-
          uv run python -m pipeline.jobs.voto_antecipado_estado
          --estado ${{ matrix.estado }}
          --saida data/publicado/voto-antecipado/${{ steps.pasta.outputs.nome }}.json
      - name: Guardar o resultado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voto-antecipado-${{ steps.pasta.outputs.nome }}
          path: data/publicado/voto-antecipado
          retention-days: 30

  # A Florida só publica o retrato do dia: o arquivo diário vive na Release, ao lado do JSON.
  florida:
    name: Florida
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARQUIVO: data/publicado/voto-antecipado/historico-fl-2026.csv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Obter o arquivo publicado
        run: |
          mkdir -p "$(dirname "$ARQUIVO")"
          url="https://github.com/${{ github.repository }}/releases/download/dados-voto-antecipado/historico-fl-2026.csv"
          curl -fsSL -o "$ARQUIVO" "$url" || echo "Ainda não há arquivo publicado; começa hoje."
      - name: Recolher e calcular
        run: >-
          uv run python -m pipeline.jobs.voto_antecipado_fl
          --saida data/publicado/voto-antecipado/fl.json
          --arquivo "$ARQUIVO"
      - name: Guardar o resultado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voto-antecipado-fl
          path: data/publicado/voto-antecipado
          retention-days: 30

  # Resumo para a página inicial. Corre mesmo que um estado falhe: esse estado entra com o
  # último ficheiro já publicado (com a sua data), nunca com dados por validar.
  # Iowa: PDF diários do Secretary of State (a partir de 14 de outubro de 2026). Antes do
  # primeiro relatório o job avisa e não produz ficheiro.
  iowa:
    name: Iowa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Restaurar ficheiros da fonte
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/brutos/ia
          key: ia-brutos-${{ github.run_id }}
          restore-keys: ia-brutos-
      - name: Recolher e calcular
        run: >-
          uv run python -m pipeline.jobs.voto_antecipado_ia
          --saida data/publicado/voto-antecipado/ia.json
      - name: Guardar o resultado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voto-antecipado-ia
          path: data/publicado/voto-antecipado
          retention-days: 30
          if-no-files-found: ignore

  # Colorado: folha de cálculo diária do Secretary of State, encontrada pelos comunicados
  # de imprensa. Antes da primeira folha da eleição geral o job avisa e não produz ficheiro.
  colorado:
    name: Colorado
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --all-packages
      # Só os comunicados e folhas públicos tal como vêm da fonte, para os pedidos condicionais.
      - name: Restaurar ficheiros da fonte
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/brutos/co
          key: co-brutos-${{ github.run_id }}
          restore-keys: co-brutos-
      - name: Recolher e calcular
        run: >-
          uv run python -m pipeline.jobs.voto_antecipado_co
          --saida data/publicado/voto-antecipado/co.json
      - name: Guardar o resultado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voto-antecipado-co
          path: data/publicado/voto-antecipado
          retention-days: 30
          if-no-files-found: ignore

  nacional:
    name: Resumo nacional
    needs: [carolina-do-norte, estados, florida, iowa, colorado]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Juntar os ficheiros dos estados
        run: |
          mkdir -p estados novos
          gh release download dados-voto-antecipado --pattern '*.json' --dir estados || true
          rm -f estados/nacional.json estados/idade-*.json
          gh run download "$GITHUB_RUN_ID" --pattern 'voto-antecipado-*' --dir novos
          find novos -mindepth 2 -maxdepth 2 -name '*.json' ! -name 'idade-*' -exec cp {} estados/ \;
          ls -la estados
      - name: Calcular
        run: uv run python -m pipeline.jobs.voto_antecipado_nacional --pasta estados
      - name: Guardar o resultado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voto-antecipado-nacional
          path: estados/nacional.json
          retention-days: 30

  # Publica os ficheiros em assets de uma Release fixa, substituídos a cada execução: o
  # build do site descarrega-os daí. Assim não há commits a cada duas horas e continua a
  # custo zero. Job separado para que só ele tenha permissão de escrita, sem código de
  # terceiros. Só publica os ficheiros produzidos nesta execução.
  publicar:
    name: Publicar na Release
    needs: nacional
    if: ${{ !cancelled() && needs.nacional.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ETIQUETA: dados-voto-antecipado
    steps:
      - name: Descarregar os resultados
        run: gh run download "$GITHUB_RUN_ID" --pattern 'voto-antecipado-*' --dir resultado
      - name: Validar
        run: |
          for f in $(find resultado -mindepth 2 -maxdepth 2 -name '*.json'); do
            jq -e '.metadados.fontes | length > 0' "$f" > /dev/null || { echo "Inválido: $f"; exit 1; }
          done
      - name: Substituir os assets da Release
        run: |
          if ! gh release view "$ETIQUETA" > /dev/null 2>&1; then
            gh release create "$ETIQUETA" --title "Dados do voto antecipado" --latest=false \
              --notes "Ficheiros publicados pelo workflow Voto antecipado. Substituídos a cada execução; só contagens agregadas."
          fi
          find resultado -mindepth 2 -maxdepth 2 \( -name '*.json' -o -name '*.csv' \) -print0 \
            | xargs -0 gh release upload "$ETIQUETA" --clobber
