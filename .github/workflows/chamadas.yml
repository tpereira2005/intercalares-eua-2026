name: Chamadas das redações

# Regista à mão, na noite eleitoral, a chamada de uma corrida feita por uma redação
# (por exemplo, a Associated Press), com a ligação para a fonte. O Escrutínio não chama
# corridas: o site mostra quem chamou e quando. Retirar uma chamada também se faz aqui.
# O ficheiro vai para a Release "resultados-2026" (chamadas-2026.json) e chega ao site
# pela API ao vivo em menos de um minuto, sem nova implantação (docs/api-ao-vivo.md).
on:
  workflow_dispatch:
    inputs:
      corrida:
        description: Corrida, como na previsão (ex. PA-07, OH-S-especial)
        required: true
      vencedor:
        description: Lado do vencedor
        type: choice
        options: [D, R, outro]
        default: D
      redacao:
        description: Redação que fez a chamada
        default: Associated Press
      url:
        description: Página da redação com a chamada
        required: true
      hora:
        description: Hora da chamada com fuso (ex. 2026-11-04T02:14:00Z); vazia usa a de agora
        default: ""
      candidato:
        description: Nome do vencedor (opcional)
        default: ""
      retirar:
        description: Retirar a chamada desta corrida em vez de a registar
        type: boolean
        default: false

permissions:
  contents: read

# Uma chamada de cada vez: duas ao mesmo tempo perderiam uma delas.
concurrency:
  group: chamadas
  cancel-in-progress: false

jobs:
  registar:
    name: Registar a chamada
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Descarregar a previsão e as chamadas atuais
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p entrada
          gh release download dados-previsao -p previsao-2026.json -D entrada --clobber
          gh release download resultados-2026 -p chamadas-2026.json -D entrada --clobber \
            || echo "::notice::Ainda não há chamadas registadas"
      # Os valores do formulário passam por variáveis de ambiente, nunca pelo texto do comando.
      - name: Atualizar o ficheiro
        working-directory: apps/web
        env:
          CORRIDA: ${{ inputs.corrida }}
          VENCEDOR: ${{ inputs.vencedor }}
          REDACAO: ${{ inputs.redacao }}
          URL_CHAMADA: ${{ inputs.url }}
          HORA: ${{ inputs.hora }}
          CANDIDATO: ${{ inputs.candidato }}
          RETIRAR: ${{ inputs.retirar }}
        run: >-
          node --experimental-strip-types scripts/registar-chamada.ts
          "$GITHUB_WORKSPACE/entrada/previsao-2026.json"
          "$GITHUB_WORKSPACE/entrada/chamadas-2026.json"
      - name: Publicar na Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view resultados-2026 > /dev/null 2>&1 || gh release create resultados-2026 \
            --title "Resultados da noite eleitoral de 2026" --latest=false \
            --notes "Resultados oficiais tal como publicados por cada estado; substituídos a cada recolha."
          gh release upload resultados-2026 entrada/chamadas-2026.json --clobber
