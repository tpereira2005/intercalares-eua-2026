[project]
name = "pipeline"
version = "0.1.0"
description = "Recolha, validação, transformação e publicação de dados eleitorais."
requires-python = ">=3.12"
dependencies = [
    "contratos",
    "httpx>=0.28",
    "numpy>=2.5.4",
    "polars>=1.34",
    "pydantic>=2.12",
    "pypdf>=6.20.1",
]

[tool.uv.sources]
contratos = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
