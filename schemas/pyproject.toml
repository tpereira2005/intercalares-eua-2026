[project]
name = "contratos"
version = "0.1.0"
description = "Contratos de dados partilhados (pydantic → JSON Schema → TypeScript)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contratos"]
